[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.1.0"
description = "Modular derivatives pricing library: option chains from IBKR or yfinance, implied volatility surfaces, and pricing under Black-Scholes, Heston, SABR and rough Bergomi through one interface."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "marimo>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4"]
data = ["yfinance>=0.2.40", "ib_async>=1.0"]

[tool.setuptools]
packages = ["volsurface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long Monte Carlo or training runs; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
