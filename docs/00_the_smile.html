      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

 = log(K/F)\u0026quot;}}}}' data-config='{}'\u003E\u003C/marimo-plotly\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "3149536865858160437c3828e089a628", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"what-you-are-looking-at\"\u003EWhat you are looking at\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe surface is the Black-Scholes implied volatility of every option a model prices,\nplotted against log-moneyness \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k = \\log(K/F)||)\u003C/marimo-tex\u003E and time to expiry \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E. Implied vol is\nthe single number that, put into the Black-Scholes formula, reproduces the price. A model\nthat agreed with Black-Scholes would draw a flat sheet. Any shape is the model telling\nyou how its distribution of returns differs from a lognormal one.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHeston (1993) lets the variance \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_t||)\u003C/marimo-tex\u003E of returns move on its own:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\frac{dF_t}{F_t} = \\sqrt{v_t}\\, dW_t, \\qquad\ndv_t = \\kappa(\\theta - v_t)\\, dt + \\xi \\sqrt{v_t}\\, dZ_t, \\qquad\nd\\langle W, Z\\rangle_t = \\rho\\, dt .\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EEach parameter leaves its own mark on the surface.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003Erho sets the skew.\u003C/strong\u003E With \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho \u0026lt; 0||)\u003C/marimo-tex\u003E, variance rises when the price falls, so the left\n  tail is fatter than the right and low strikes carry higher implied vol.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Exi sets the curvature.\u003C/strong\u003E Vol of variance mixes many lognormals with different\n  variances, which fattens both tails and bends the smile upward at both ends.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Ekappa and theta set the term structure.\u003C/strong\u003E Variance starts at \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_0||)\u003C/marimo-tex\u003E and is pulled\n  towards \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\theta||)\u003C/marimo-tex\u003E at rate \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\kappa||)\u003C/marimo-tex\u003E, so long-dated at-the-money vol tends to\n  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sqrt{\\theta}||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\kappa||)\u003C/marimo-tex\u003E says how quickly it gets there. Mean reversion also\n  averages out the variance shocks, which is why the skew fades with maturity.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Ev0 sets the level\u003C/strong\u003E at the short end: at-the-money vol for small \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E is close to\n  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sqrt{v_0}||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EBlack-Scholes is flat because it is the yardstick. Its returns are Gaussian with variance\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sigma^2 T||)\u003C/marimo-tex\u003E at every strike and maturity, and inverting a Black-Scholes price through\nBlack-Scholes gives back \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sigma||)\u003C/marimo-tex\u003E. Flip the switch to see it.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f4e83adb72e2d80c70aa62618cae3701", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"try-this\"\u003ETry this\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EMake a guess before you move the slider, then open the answer.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7ffde14b88237a3af661ea9e57342fda", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003col\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eSet rho to 0. Which way does the skew go, and is the smile symmetric?\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ol\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003col start=\u0026#92;\u0026quot;2\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eWith rho at 0, raise xi from 0.4 to 1.2. Which moves more, the wings or the at-the-money vol?\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ol\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003col start=\u0026#92;\u0026quot;3\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eSet v0 = 0.01 and theta = 0.06. Is short-dated or long-dated vol higher? Now raise kappa: what happens?\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ol\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe downward slope disappears and the smile becomes a U that is exactly symmetric in \u003Cmarimo-tex class=\"arithmatex\"\u003E||(k||)\u003C/marimo-tex\u003E. With zero correlation, implied vol is an even function of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\log(K/F)||)\u003C/marimo-tex\u003E for any stochastic volatility model (Renault and Touzi 1996, Math. Finance 6(3)). Push rho positive and the skew turns upward.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAt short maturities the wings rise sharply and at-the-money vol falls a little: vol of variance adds curvature, not level. At one year the whole smile drops, at-the-money most, so it still bends more. The effect is strongest at short maturities, where mean reversion has not yet averaged the variance shocks away.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELong-dated vol is higher: variance is expected to drift up from \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_0||)\u003C/marimo-tex\u003E to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\theta||)\u003C/marimo-tex\u003E. With kappa = 3, at-the-money vol climbs from about 10% at one day to about 20% at one year. With kappa = 10 the climb happens sooner and one-year vol reaches 23%, close to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sqrt{\\theta} = 24.5\\%||)\u003C/marimo-tex\u003E; the skew also flattens at every maturity beyond a few days.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "c9efb9e4c1c10761716dd2c8c12fffdd", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: flex-start;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='flex: 1;display: flex;min-width: 0;min-height: 0'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-elemen 92;u003c/span\u0026#92;u003e\u0026quot;' data-start='0.01' data-stop='0.15' data-step='0.001' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='vblA-3' random-id='48b8e56b-220a-40ba-5770-5a5e0b382658'\u003E\u003Cmarimo-slider data-initial-value='0.4' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003exi, vol of variance\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='0.05' data-stop='2.0' data-step='0.05' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='vblA-4' random-id='538a814e-a325-6bbd-d960-626f4385d9b1'\u003E\u003Cmarimo-slider data-initial-value='-0.9' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003erho, correlation\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='-0.99' data-stop='0.99' data-step='0.01' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex: 3'\u003E\u003Cmarimo-ui-element object-id= u0026quot;:\u0026quot;-skew\u0026quot;},\u0026quot;range\u0026quot;:[-1.3010299956639813,1.0]},\u0026quot;margin\u0026quot;:{\u0026quot;l\u0026quot;:50,\u0026quot;r\u0026quot;:10,\u0026quot;t\u0026quot;:40,\u0026quot;b\u0026quot;:40},\u0026quot;legend\u0026quot;:{\u0026quot;x\u0026quot;:0.55,\u0026quot;y\u0026quot;:0.95},\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;At-the-money skew, -d(iv)/dk at k = 0\u0026quot;},\u0026quot;height\u0026quot;:420,\u0026quot;uirevision\u0026quot;:\u0026quot;keep\u0026quot;}}' data-config='{}'\u003E\u003C/marimo-plotly\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "a92431587d6c7b3feb3c7c89002f4579", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"what-the-market-says\"\u003EWhat the market says\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe SPY skew keeps steepening as expiry shrinks, and Heston's does not. The figure above\nplots minus the at-the-money skew \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\partial \\sigma / \\partial k||)\u003C/marimo-tex\u003E against maturity on log\naxes. SPY goes from 0.28 at 358 days to\n1.56 at 1 day, close to a straight line:\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(|\\psi(T)| \\approx 0.30\\, T^{-0.26}||)\u003C/marimo-tex\u003E. Heston's skew flattens to a\nconstant, roughly \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho\\xi / (4\\sqrt{v_0})||)\u003C/marimo-tex\u003E, as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T \\to 0||)\u003C/marimo-tex\u003E, and decays like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1/T||)\u003C/marimo-tex\u003E\nonce \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E is well past \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1/\\kappa||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENo slider setting fixes both ends. Heston can make a one-day skew as steep as the\nmarket's (try xi = 2, rho = -0.99), but then the one-year skew is far too steep. A least\nsquares fit of all five parameters to the SPY at-the-money vols and skews, at every\nexpiry at once, pushes rho to its bound of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-0.99||)\u003C/marimo-tex\u003E and still leaves the one-day skew\nnear 1.0 against the market's 1.6, and the one-year skew at 0.19 against 0.27 (fit on\nthe 2026-10-07 snapshot, see \u003Ccode\u003ELOG.md\u003C/code\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA power law in \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E is what rough volatility predicts. If volatility is driven by a\nfractional Brownian motion with Hurst exponent \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H \u0026lt; 1/2||)\u003C/marimo-tex\u003E, the short-dated skew behaves\nlike \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T^{H - 1/2}||)\u003C/marimo-tex\u003E (Bayer, Friz and Gatheral 2016, \u003Cem\u003EPricing under rough volatility\u003C/em\u003E,\nQuant. Finance 16(6)), and time series of realised volatility suggest \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H \\approx 0.1||)\u003C/marimo-tex\u003E\n(Gatheral, Jaisson and Rosenbaum 2018, \u003Cem\u003EVolatility is rough\u003C/em\u003E, Quant. Finance 18(6)).\nThis snapshot gives an exponent of 0.26, so \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H \\approx 0.24||)\u003C/marimo-tex\u003E:\nrougher than Brownian motion, less rough than the time series estimate. The exponent\ndepends on the window used to measure the skew, which Session 04 takes up with rough\nBergomi behind the same interface.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EData: SPY options from Yahoo Finance, last trade prices at 2026-10-07 20:00 UTC, file\n\u003Ccode\u003Edata/snapshots/SPY_2026-10-07.parquet\u003C/code\u003E. Forwards come from put-call parity per expiry,\ndiscount factors from the 13-week Treasury bill rate.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
